name: apply-source-archive

# The uploaded source archive is stored with Git LFS, whose storage host is unreachable from the assistant sandbox.
# A runner can reach it, and objects it pushes are readable again, so this job unwraps the archive (it contains
# further zips), publishes a factual listing, and adopts the extracted tree as the branch tree.
#
# `.github/workflows` is preserved: a GITHUB_TOKEN push that modifies workflow files is refused, and the build
# pipeline is not part of the source being adopted.
on:
  push:
    paths:
      - '.github/workflows/apply-source-archive.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Unwrap, report, and adopt the archive
        run: |
          set -uo pipefail
          report=archive-report.txt
          work=/tmp/work
          rm -rf "$work" && mkdir -p "$work"
          : > "$report"

          log() { echo "$@" | tee -a "$report"; }
          log "# Archive report"
          log ""
          git lfs install --local >> "$report" 2>&1
          git lfs pull --include="5eb1c06c-protodroid/*.zip" >> "$report" 2>&1
          outer=$(ls 5eb1c06c-protodroid/*.zip | head -n1)
          log "- outer archive: $outer ($(stat -c%s "$outer") bytes)"

          current="$outer"
          level=0
          root=""
          while [ "$level" -lt 5 ]; do
            dir="$work/x$level"
            mkdir -p "$dir"
            unzip -q "$current" -d "$dir" >> "$report" 2>&1 || { log "- unzip failed at level $level"; break; }
            count=$(find "$dir" -type f | wc -l)
            first=$(find "$dir" -type f | head -n1)
            magic=$(head -c 2 "$first" 2>/dev/null)
            log "- level $level: $count file(s), first=$first, magic=$magic"
            if [ "$count" -eq 1 ] && [ "$magic" = "PK" ]; then
              current="$first"
              level=$((level + 1))
              continue
            fi
            root="$dir"
            break
          done

          if [ -n "$root" ]; then
            inner=$(find "$root" -mindepth 1 -maxdepth 1)
            if [ "$(find "$root" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$inner" ]; then
              root="$inner"
            fi
          fi

          log ""
          log "## Extracted tree"
          log "- root: ${root:-none}"
          log "- files: $(find "${root:-/nonexistent}" -type f 2>/dev/null | wc -l)"
          log "- top level: $(find "${root:-/nonexistent}" -mindepth 1 -maxdepth 1 -printf '%f ' 2>/dev/null)"
          for marker in android/AndroidManifest.xml tools/recomp/recomp.py src/native/Makefile CHANGELOG.md; do
            found=$(find "${root:-/nonexistent}" -maxdepth 3 -path "*/$marker" 2>/dev/null | head -n1)
            log "- $marker: ${found:-absent}"
          done
          manifest=$(find "${root:-/nonexistent}" -maxdepth 3 -name AndroidManifest.xml 2>/dev/null | head -n1)
          if [ -n "$manifest" ]; then
            log "- manifest: $(grep -o 'android:versionCode="[0-9]*"\|android:versionName="[^"]*"' "$manifest" | tr '\n' ' ')"
          fi
          parts=$(find "${root:-/nonexistent}" -maxdepth 5 -path '*build/recomp/native/part_*.c' 2>/dev/null | wc -l)
          log "- generated engine parts: $parts"
          log ""
          log "## Largest files in the archive"
          log '```'
          unzip -l "$outer" 2>/dev/null | sort -k1 -nr | head -n 15 | tee -a "$report"
          log '```'

          valid=0
          if [ -n "$root" ] && [ -f "$root/android/AndroidManifest.xml" ] && [ -f "$root/tools/recomp/recomp.py" ] && [ -d "$root/src/native" ]; then
            valid=1
          fi
          log "- adoptable: $valid"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$valid" -eq 1 ]; then
            mkdir -p "$work/keep" && rm -rf "$work/keep/workflows"
            cp -a .github/workflows "$work/keep/workflows"
            shopt -s dotglob
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$root"/. .
            rm -rf .github/workflows && mkdir -p .github && cp -a "$work/keep/workflows" .github/workflows
            log "- tree replaced from $root"
          fi

          cp "$report" ./archive-report.txt
          git add -A
          if git diff --cached --quiet; then
            log "- nothing to commit"
            exit 0
          fi
          git commit -q -m "Adopt the uploaded v0.16 source archive [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
