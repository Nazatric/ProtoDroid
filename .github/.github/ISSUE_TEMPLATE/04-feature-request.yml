name: Feature or improvement
description: Suggest a useful addition, refinement, or accessibility improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay or controls
        - Graphics
        - Audio or movies
        - Setup or launcher
        - Saves or updates
        - Mods
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Start with the player benefit; no implementation design is needed.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Include useful examples or alternatives.
    validations:
      required: true
