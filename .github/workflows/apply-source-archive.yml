name: apply-source-archive

# One-shot helper: the source archive in this repository is stored with Git LFS, and the assistant's sandbox
# cannot reach the LFS storage host. A GitHub runner can, and git objects pushed from here are readable again,
# so this job materialises the archive's contents as the branch tree.
#
# `.github/workflows` is preserved rather than replaced: a GITHUB_TOKEN push that modifies workflow files is
# refused, and the build pipeline in this branch is not part of the source being adopted.
on:
  push:
    paths:
      - '.github/workflows/apply-source-archive.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch the archive through Git LFS
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="5eb1c06c-protodroid/*.zip"
          ZIP=$(ls 5eb1c06c-protodroid/*.zip | head -n1)
          echo "archive=$ZIP" >> "$GITHUB_ENV"
          if head -c 40 "$ZIP" | grep -q 'git-lfs'; then
            echo "::error title=archive::the archive is still an LFS pointer"
            exit 1
          fi
          echo "archive bytes: $(stat -c%s "$ZIP")"

      - name: Inspect the archive before touching the tree
        run: |
          set -euo pipefail
          rm -rf /tmp/archive && mkdir -p /tmp/archive
          unzip -q "$archive" -d /tmp/archive
          ROOT=/tmp/archive
          count=$(find "$ROOT" -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$count" -eq 1 ] && [ -d "$(find "$ROOT" -mindepth 1 -maxdepth 1)" ]; then
            ROOT=$(find "$ROOT" -mindepth 1 -maxdepth 1)
          fi
          echo "root=$ROOT" >> "$GITHUB_ENV"
          FILES=$(find "$ROOT" -type f | wc -l)
          echo "files=$FILES" >> "$GITHUB_ENV"
          VERSION=$(grep -o 'android:versionCode="[0-9]*"' "$ROOT/android/AndroidManifest.xml" 2>/dev/null || echo missing)
          NAME=$(grep -o 'android:versionName="[^"]*"' "$ROOT/android/AndroidManifest.xml" 2>/dev/null || echo missing)
          PARTS=$(find "$ROOT/build/recomp/native" -name 'part_*.c' 2>/dev/null | wc -l)
          echo "::notice title=archive files::$FILES files, generated engine parts: $PARTS"
          echo "::notice title=archive version::$VERSION $NAME"
          echo "::notice title=archive shape::$(find "$ROOT" -mindepth 1 -maxdepth 1 -printf '%f ')"
          test -f "$ROOT/android/AndroidManifest.xml"
          test -f "$ROOT/tools/recomp/recomp.py"
          test -d "$ROOT/src/native"

      - name: Replace the tracked tree with the archive
        run: |
          set +e
          exec 3>&1
          {
            set -euo pipefail
            mkdir -p /tmp/keep && rm -rf /tmp/keep/workflows
            cp -a .github/workflows /tmp/keep/workflows
            shopt -s dotglob
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$root"/. .
            rm -rf .github/workflows && mkdir -p .github && cp -a /tmp/keep/workflows .github/workflows
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "::notice title=archive::the archive matches the branch tree already"
              exit 0
            fi
            git commit -q -m "Replace the tree with the uploaded source archive"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "::notice title=archive::tree replaced with $files files from the archive"
          } 2>&1 | tee /tmp/apply.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 12 /tmp/apply.log | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-800)
            echo "::error title=apply failed::$message"
            exit 1
          fi
          exit 0
