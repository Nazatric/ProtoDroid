name: apply-source-archive

# The source archive is stored with Git LFS, whose storage host is unreachable from the assistant sandbox. A runner
# can reach it, and objects it pushes are readable again, so this job publishes a factual listing of the archive and
# then, when the archive looks like a source tree, adopts it as the branch tree.
on:
  push:
    paths:
      - '.github/workflows/apply-source-archive.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect the archive and publish a report
        run: |
          set -uo pipefail
          report=archive-report.txt
          {
            echo "# Archive report"
            echo
            echo "## Fetch"
            git lfs install --local
            git lfs pull --include="5eb1c06c-protodroid/*.zip"
            ZIP=$(ls 5eb1c06c-protodroid/*.zip | head -n1)
            echo "archive: $ZIP"
            echo "bytes: $(stat -c%s "$ZIP")"
            echo "magic: $(head -c 4 "$ZIP" | od -An -c | tr -s ' ')"
            echo
            echo "## Listing"
            echo '```'
            unzip -l "$ZIP" 2>&1 | head -n 400
            echo '```'
            echo
            echo "## Extraction"
            rm -rf /tmp/archive && mkdir -p /tmp/archive
            unzip -q "$ZIP" -d /tmp/archive 2>&1 | head -n 20
            echo "top level: $(find /tmp/archive -mindepth 1 -maxdepth 1 -printf '%f ' )"
            echo "file count: $(find /tmp/archive -type f | wc -l)"
            echo
            echo "## Candidate source markers"
            for marker in android/AndroidManifest.xml tools/recomp/recomp.py src/native/Makefile CHANGELOG.md; do
              found=$(find /tmp/archive -maxdepth 3 -path "*/$marker" | head -n1)
              echo "- $marker: ${found:-absent}"
            done
            manifest=$(find /tmp/archive -maxdepth 3 -name AndroidManifest.xml | head -n1)
            if [ -n "$manifest" ]; then
              echo "- manifest version: $(grep -o 'android:versionCode="[0-9]*"\|android:versionName="[^"]*"' "$manifest" | tr '\n' ' ')"
            fi
            echo
            echo "## Largest entries"
            echo '```'
            unzip -l "$ZIP" 2>&1 | sort -k1 -n -r | head -n 25
            echo '```'
          } > "$report" 2>&1
          cat "$report"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$report"
          git commit -q -m "Publish the uploaded archive listing [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
