name: symbolize-dxvk

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing the debug-symbols artifact
        required: true
        default: '40531497695'

permissions:
  contents: read
  issues: write

jobs:
  symbolize:
    runs-on: ubuntu-24.04
    steps:
      - name: Download matching debug symbols
        uses: actions/download-artifact@v4
        with:
          name: debug-symbols
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/protodroid-symbols

      - name: Symbolize new and original DXVK offsets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          command -v llvm-addr2line
          LIB=$(find /tmp/protodroid-symbols -type f -name 'libdxvk_d3d9.so*' | head -n 1)
          test -n "$LIB"
          echo "library=$LIB"
          ls -lh "$LIB"
          sha256sum "$LIB"
          {
            echo '=== NEW CRASH: Direct3DCreate9 abort ==='
            llvm-addr2line -f -C -e "$LIB" \
              0x10d85c 0x10ddcc 0x10edac 0x1ec7b0 0x1ec9a0 0x28368c \
              0x30afd8 0x30affc 0x30876c 0x3088dc 0x308fb0
            echo '=== ORIGINAL CRASH: Mali descriptor/device path ==='
            llvm-addr2line -f -C -e "$LIB" \
              0x24793c 0x2472a8 0x153cc8 0x1e9988 0x1e9dc0
          } | tee /tmp/dxvk-symbolization.txt
          gh api repos/${{ github.repository }}/issues/1/comments \
            --raw-field body="DXVK symbolization for run ${{ inputs.run_id }}:\n\`\`\`\n$(cat /tmp/dxvk-symbolization.txt)\n\`\`\`"
