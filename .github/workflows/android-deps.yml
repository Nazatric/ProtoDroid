# Third-party native libraries of the Android port (SDL2, FAudio, DXVK d3d9; Turnip and libadrenotools for
# Adreno), built on GitHub's runners.
# Nothing here touches game files or code generated from them: the recompiled engine is built locally only.
name: android-deps

on:
  push:
    paths: [android/build-deps.sh, android/build-turnip.sh, android/patches/**, .github/workflows/android-deps.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: out/${{ matrix.abi }}
          key: android-deps-standalone-vulkan-wrapper-v2-${{ matrix.abi }}-${{ hashFiles('android/build-deps.sh', 'android/build-vulkan-wrapper.sh', 'android/patches/**') }}

      - name: Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build glslang-tools pkg-config python3-pip 7zip bison flex
          pip3 install --user --break-system-packages meson==1.5.2 mako pyyaml packaging

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          set -euo pipefail
          export PATH=$HOME/.local/bin:$PATH
          echo "NDK: $ANDROID_NDK_HOME"
          android/build-deps.sh ${{ matrix.abi }} src out/${{ matrix.abi }} 2>&1 | tee /tmp/build-deps-${{ matrix.abi }}.log

      - name: Report dependency build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 180 /tmp/build-deps-${{ matrix.abi }}.log || true
          gh api repos/${{ github.repository }}/issues/1/comments \
            --raw-field body="Standalone dependency build failed for ${{ github.sha }} (${{ matrix.abi }}):\n\`\`\`\n$(tail -n 180 /tmp/build-deps-${{ matrix.abi }}.log 2>/dev/null || echo 'no dependency log')\n\`\`\`" || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-deps-${{ matrix.abi }}
          path: |
            out/${{ matrix.abi }}/lib/*.so
            out/${{ matrix.abi }}/include
          retention-days: 30

  turnip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: out/turnip
          key: android-turnip-gen8-v1-${{ hashFiles('android/build-turnip.sh', 'android/patches/turnip-gen8/**') }}

      - name: Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build glslang-tools bison flex python3-pip
          pip3 install --user --break-system-packages meson==1.5.2 mako pyyaml packaging

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          export PATH=$HOME/.local/bin:$PATH
          android/build-turnip.sh src out/turnip

      - uses: actions/upload-artifact@v4
        with:
          name: android-turnip-arm64-v8a
          path: |
            out/turnip/lib
            out/turnip/include
          retention-days: 30
