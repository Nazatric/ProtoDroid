name: publish-previous-apks

permissions:
  contents: write

on:
  push:
    branches: [arena/0cb953c5-protodroid]
  workflow_dispatch:
    inputs:
      approve:
        description: Type RELEASE to verify and upload the approved APKs
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || inputs.approve == 'RELEASE'
    steps:
      - uses: actions/checkout@v4

      - name: Verify and upload the approved APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)

          publish() {
            local version=$1 code=$2 run=$3 commit=$4
            local tag="protodroid-v$version"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            test "$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$commit"
            test "$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json status --jq .status)" = completed
            test "$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success

            local dir="/tmp/protodroid-v$version"
            rm -rf "$dir"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name prototype-apk --dir "$dir"
            test -s "$dir/prototype.apk"
            source "$dir/version.txt"
            test "$versionName" = "$version"
            test "$versionCode" = "$code"

            "$APKSIGNER" verify --verbose "$dir/prototype.apk"
            "$ZIPALIGN" -c -P 16 4 "$dir/prototype.apk"
            "$AAPT2" dump badging "$dir/prototype.apk" > "$dir/badging.txt"
            grep -F "package: name='com.protodroid' versionCode='$code' versionName='$version'" "$dir/badging.txt"
            unzip -q "$dir/prototype.apk" 'lib/arm64-v8a/libmain.so' -d "$dir/check"
            test "$(stat -c%s "$dir/check/lib/arm64-v8a/libmain.so")" -gt 100000

            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'prototype.apk'; then
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "$dir/prototype.apk"
            fi
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,targetCommitish,isDraft,assets
          }

          publish 0.2 2 40880853367 eec15e766399dee4d8a3a15d6601cd507e7a133e
          publish 0.3 3 40894239685 ebb8b00b93db88525dbffa846284efffc7382471
          publish 0.4 4 40920153377 aebf690838b7cae28e0dbb23ad3d2e03486a137e
          publish 0.5 5 40932709940 904a7ffa9722b95859ec1e4daacefc5c0f1f40e0
          publish 0.6 6 41016250100 27e29cfb64406fe1c22a0526cd6626349ef10fe3
