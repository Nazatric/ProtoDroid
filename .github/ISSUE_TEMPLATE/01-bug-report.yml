name: Bug report
description: Report incorrect behavior without a crash or freeze
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: ProtoDroid version
      description: Visible version and commit, if shown.
      placeholder: 0.15
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone, chip, and Android version
      placeholder: Phone model; SoC/GPU; Android version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay or controls
        - Graphics
        - Audio or movies
        - Setup or launcher
        - Saves or updates
        - Mods
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and any relevant settings.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and extra context
      description: Attach logs from the failed run. Do not upload game, cache, or save files.
      render: text
    validations:
      required: true
