name: ✨ Feature or improvement
description: Suggest a useful addition, refinement, or accessibility improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Start with the player benefit—you do not need to design the implementation.

        Requests are considered alongside visual quality, Bink audio/cutscenes, controls, save safety, and compatibility across supported devices.
  - type: dropdown
    id: area
    attributes:
      label: What would it improve?
      options:
        - Launcher or updates
        - Graphics or video
        - Audio or Bink cutscenes
        - Controls or accessibility
        - Saves or file management
        - Performance or battery
        - Device compatibility
        - Setup or documentation
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the frustration, limitation, or missing option from a player's point of view.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Explain the behavior you want. A rough idea is enough; mockups and examples are optional.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples or alternatives (optional)
      description: Mention other apps, an existing workaround, or anything that illustrates the idea. Please link to examples rather than uploading large assets or game data files.
    validations:
      required: false
