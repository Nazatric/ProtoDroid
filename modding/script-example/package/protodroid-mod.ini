[mod]
schema = 1
api = 2
id = protodroid.example.lua_fov
name = ProtoDroid Lua FOV example
version = 1.0
author = ProtoDroid
description = Sandboxed Lua example with named symbols, a guarded FOV detour, settings, custom events, and lifecycle callbacks.
engine_sha256 = d331be205bdde99897952ee88261ab7e63c5c65e36a4660e2a367886a3537071
priority = 100

[content]
script = scripts/main.lua
script_api = 1

[setting.enabled]
type = toggle
label = Enable FOV adjustment
description = Turns this script's camera adjustment on or off for the next Play.
default = 1
order = 10
group = Camera

[setting.fov_offset]
type = slider
label = FOV offset
description = Degrees added by this script. Set the native example to zero or disable it to avoid stacking adjustments.
default = 5
min = -20
max = 20
step = 0.5
order = 20
group = Camera

[setting.frame_logging]
type = choice
label = Startup logging
description = Choose whether the script writes one diagnostic message on the first engine frame.
options = Quiet|First frame
default = Quiet
order = 30
group = Diagnostics
