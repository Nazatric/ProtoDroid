[mod]
schema = 1
api = 2
id = protodroid.minimap
name = Minimap
version = 1.1
author = ProtoDroid
description = Move and resize the HUD minimap live from the in-game settings panel: corner presets, fine sliders, and a size slider. Everything drawn inside the minimap follows the rect.
engine_sha256 = d331be205bdde99897952ee88261ab7e63c5c65e36a4660e2a367886a3537071
priority = 100

[content]
script = scripts/main.lua
script_api = 1

[setting.enabled]
type = toggle
label = Enable minimap editing
description = Turns the minimap detour on or off. Changing this applies on the next Play; every other option applies live.
default = 1
order = 10
group = Minimap

[setting.position_preset]
type = choice
label = Corner preset
description = Snap the minimap to a screen corner. Custom keeps the layout position and uses only the sliders.
options = Bottom left|Bottom right|Top left|Top right|Custom
default = Bottom left
order = 20
group = Minimap

[setting.horizontal_shift]
type = slider
label = Horizontal shift
description = Fine horizontal adjustment in pixels, applied after the preset.
default = 0
min = -480
max = 480
step = 2
order = 30
group = Minimap

[setting.vertical_shift]
type = slider
label = Vertical shift
description = Fine vertical adjustment in pixels, applied after the preset.
default = 0
min = -270
max = 270
step = 2
order = 40
group = Minimap

[setting.scale]
type = slider
label = Size %
description = Resize the minimap rectangle itself. Everything drawn inside it follows. 100 = the game's own size.
default = 100
min = 50
max = 300
step = 5
order = 45
group = Minimap

[setting.rect_offset]
type = slider
label = Rect offset (calibration)
description = Byte offset of the minimap rectangle inside its HUD element. 0 auto-calibrates; check the log for the picked offset and the candidate list if you need to override it.
default = 0
min = 0
max = 2048
step = 4
order = 50
group = Calibration
