[mod]
schema = 1
api = 2
id = protodroid.example.minimap
name = Minimap Position
version = 1.0
author = ProtoDroid
description = Move the HUD minimap with presets (four corners) or fine sliders, adjusted live from the in-game MODS panel.
engine_sha256 = d331be205bdde99897952ee88261ab7e63c5c65e36a4660e2a367886a3537071
priority = 100

[content]
script = scripts/main.lua
script_api = 1

[setting.enabled]
type = toggle
label = Enable minimap positioning
description = Turns the minimap detour on or off. Changing this applies on the next Play; every other option applies live.
default = 1
order = 10
group = Minimap

[setting.position_preset]
type = choice
label = Preset
description = Snap the minimap to a screen corner. Custom keeps the layout position and uses only the sliders.
options = Bottom left|Bottom right|Top left|Top right|Custom
default = Bottom left
order = 20
group = Minimap

[setting.horizontal_shift]
type = slider
label = Horizontal shift
description = Fine horizontal adjustment in pixels, applied after the preset.
default = 0
min = -480
max = 480
step = 2
order = 30
group = Minimap

[setting.vertical_shift]
type = slider
label = Vertical shift
description = Fine vertical adjustment in pixels, applied after the preset.
default = 0
min = -270
max = 270
step = 2
order = 40
group = Minimap

[setting.rect_offset]
type = slider
label = Rect offset (calibration)
description = Byte offset of the minimap rectangle inside its HUD element. 0 runs the calibration scanner (see the log); set it to the +offset the scanner reports for the minimap quad.
default = 0
min = 0
max = 2048
step = 4
order = 50
group = Calibration
