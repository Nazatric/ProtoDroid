[mod]
schema = 1
api = 2
id = protodroid.example.fov
name = ProtoDroid FOV example
version = 1.2
author = ProtoDroid
description = Native ARM64 example with named engine-symbol lookup, script events, configurable FOV, and per-mod options.
engine_sha256 = d331be205bdde99897952ee88261ab7e63c5c65e36a4660e2a367886a3537071
priority = 100

[content]
plugin = lib/arm64-v8a/libprotodroid_example.so
plugin_api = 3

[setting.enabled]
type = toggle
label = Enable FOV adjustment
description = Turns this plugin's camera adjustment on or off for the next Play.
default = 1
order = 10
group = Camera

[setting.fov_offset]
type = slider
label = FOV offset
description = Degrees added to the game's camera FOV. Zero keeps the original value.
default = 5
min = -20
max = 20
step = 0.5
order = 20
group = Camera

[setting.frame_logging]
type = choice
label = Frame logging
description = Choose whether the example writes one diagnostic message after 300 engine frames.
options = Quiet|Every 300 frames
default = Every 300 frames
order = 30
group = Diagnostics

[setting.author_note]
type = text
label = Author note
description = A short note written to the native log when this example starts.
default = Hello from ProtoDroid
max_length = 80
order = 40
group = Diagnostics
